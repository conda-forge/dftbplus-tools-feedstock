{% set name = "dftbplus" %}
{% set version = "26.1" %}
{% set build = 0 %}

package:
  name: {{ name|lower }}-tools
  version: "{{ version }}"

source:
  url: https://github.com/dftbplus/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 01facc0708ef3c6182730c4de449c74a12945ed2c266fd78b7f5d42e9b53da0a

build:
  number: {{ build }}
  noarch: python
  script: {{ PYTHON }} -m pip install tools/dptools -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - numpy
    - dftbplus

test:
  requires:
    - python {{ python_min }}
  imports:
    - dptools

about:
  home: https://{{ name }}.org
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file:
    - LICENSE
    - COPYING
    - COPYING.LESSER
  summary: 'DPTOOLS: Processing and converting data related to the DFTB+ package'
  doc_url: https://{{ name }}-recipes.readthedocs.io
  dev_url: https://github.com/{{ name }}/{{ name }}

extra:
  recipe-maintainers:
    - aradi
    - awvwgk
    - bhourahine
